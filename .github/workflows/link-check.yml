name: External link check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-external-links.mjs'
      - 'scripts/lib/link-status.mjs'
      - '.github/workflows/link-check.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:links
      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-links
          path: reports/external-links.json
          retention-days: 30
